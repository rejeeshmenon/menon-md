summary: >-
  Academic internal medicine physician and clinical assistant professor who also builds the software his
  clinics run on. Ten years of inpatient medicine in U.S. community hospitals; a
  translational research background that took an amino-acid formulation from the
  Ussing chamber to a Nestle-licensed product; a seven-clinic dermatology group in
  India that serves as a live environment for shipping and testing clinical software.
  Builds solo with Claude Code CLI, writing the prompts and owning the clinical
  logic, the human-in-the-loop boundaries, the safety rules for what generative output
  may say to a patient, and the compliance decisions.

