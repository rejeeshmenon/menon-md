research:
  narrative: >-
    Postdoctoral research scholar at the University of Florida (2011 to 2013). The
    team's intestinal-transport work produced enterade, an amino-acid rehydration
    formulation funded by NASA/NSBRI, licensed worldwide to Nestle Health Science
    (2018), and studied at Harvard, Dana-Farber, the U.S. Army and the University of
    Kentucky. Co-investigator on the first randomized trial in chikungunya arthritis
    (120 patients, GCP conditions), now cited in UpToDate and national guidelines.
  lineage:
    - stage: Bench research
      detail: Ussing-chamber intestinal-transport work, University of Florida, 2011 to 2013
    - stage: Formulation
      detail: enterade, an amino-acid rehydration formulation
    - stage: External validation
      detail: NASA/NSBRI funding; studied at Harvard, Dana-Farber, the U.S. Army and the University of Kentucky
    - stage: Commercial license
      detail: Licensed worldwide to Nestle Health Science, 2018
  positions:
    - id: uf
      title: Postdoctoral Research Scholar
      organization: University of Florida, Department of Radiation Oncology
      location: Gainesville, FL
      start: "2011"
      end: "2013"
      bullets:
        - Intestinal nutrient-electrolyte transport after radiation and chemotherapy; work that led to the amino-acid formulation enterade.
        - Ussing-chamber electrophysiology, radioisotope flux, confocal microscopy and immunohistochemistry.
  metrics:
    citations: 223
    hIndex: 6
    i10Index: 6
