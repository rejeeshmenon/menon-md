projects:
  intro: >-
    Each system was specified, built and shipped solo, with AI-assisted development
    (Claude Code CLI and agentic tooling) and no other engineers. Rejeesh writes the
    prompts and owns the clinical logic, the autonomy boundaries and the compliance decisions.
  disclosure: >-
    The safety-design decisions below are self-reported. Unlike the licenses and
    publications elsewhere on this page, no external body yet certifies clinical-AI
    autonomy-boundary design of this kind.
  items:
    - id: superhuman
      name: SuperHuman
      tagline: Clinical-intelligence tool for GLP-1 and metabolic care
      status: In pilot, 2026
      role: Designed and built
      start: "2026"
      stack:
        - Next.js
        - Supabase
        - PostgreSQL
        - Vultr
        - AWS
        - HIPAA-conscious architecture
      bullets:
        - label: What it does
          text: Consolidates labs, wearable data and prescription history into physician-reviewed guidance.
        - label: AI's role
          text: Author of the clinical logic and the autonomy boundary, meaning what the tool decides on its own and what requires physician sign-off.
        - label: Safety and compliance
          text: Every piece of generated guidance is checked against source data during the pilot.
        - label: Safety and compliance
          text: "Compliance decisions: BAA-covered data boundary, synthetic-data development, and a decision-support design built to meet the FDA's non-device clinical decision support criteria, not an autonomous diagnostic device."
        - label: Deployment
          text: Piloting inside the DermaVue clinic network.
    - id: clinic-os
      name: DermaVue Clinic OS
      tagline: Patient engagement and CRM platform
      status: Live across seven clinics, 2025 to present
      role: Built and shipped
      start: "2025"
      stack:
        - NestJS
        - Next.js
        - Python
        - Twenty CRM
        - Chatwoot
        - WhatsApp Business API
        - Docker on Linux VPS
      bullets:
        - label: What it does
          text: Patient messaging for all seven clinics across WhatsApp, Instagram and Facebook Messenger, with automatic lead qualification into one CRM.
        - label: AI's role and safety
          text: Designed the automated responder "Priya", including forbidden clinical topics and red-flag escalation rules, with live log review each release.
        - label: What it does
          text: Inbound lead integration via webhooks with clinic routing and de-duplication.
    - id: commerce
      name: DermaVue Commerce
      tagline: Online store for the group's skincare line
      status: Shipped, 2026
      role: Built and shipped
      start: "2026"
      stack:
        - Astro
        - Vendure
        - PostgreSQL
      bullets:
        - label: What it does
          text: Search-optimized storefront with an ingredient database linking each product to the evidence behind its formulation.
    - id: dermavue-web
      name: dermavue.com
      tagline: Public clinical web platform
      status: Live
      role: Built and maintains
      start: "2017"
      url: https://dermavue.com
      stack:
        - WordPress (PHP, hand-coded templates)
        - Astro
        - schema.org JSON-LD
        - Search-indexing automation
      bullets:
        - label: What it does
          text: Condition, procedure and location pages with hand-coded medical schema and answer-engine-oriented structure.

